plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.github.onakrainikoff'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    repositories {
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

dependencies {
    compileOnly 'org.springframework:spring-context:6.2.19'
    implementation 'com.github.onakrainikoff:reloadable-resource-4j:1.1.0'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.5'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'

    compileOnly 'org.projectlombok:lombok:1.18.36'
    compileOnly 'org.slf4j:slf4j-api:2.0.12'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
    testImplementation 'org.springframework:spring-test:6.2.19'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.16'
    testImplementation 'org.springframework.boot:spring-boot-starter-logging:3.5.16'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'reloadable-resource-spring'
                description = 'Spring integration for reloadable-resource-4j'
                url = 'https://github.com/onakrainikoff/reloadable-resource-spring'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
            }
        }
    }
}

tasks.named('jar') {
    from('LICENSE') {
        into 'META-INF'
    }
}